name: Bug report
description: Report something that is broken or incorrect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Do **not** include Cursor session tokens, Telegram bot tokens, or other secrets.

  - type: input
    id: version
    attributes:
      label: Cursor Checker version
      description: Settings → About, or the version from the release you installed
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.0
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do before the problem appeared?
      placeholder: |
        1. Open Settings → ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Redact any tokens or personal data.
    validations:
      required: false

  - type: dropdown
    id: install
    attributes:
      label: How did you install the app?
      options:
        - GitHub release (.zip / .dmg)
        - Built from source
        - Other
    validations:
      required: false
